name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 tests/migration_test.py
      # The production build needs the private .openai hosting metadata and the
      # verified pre-update snapshot, so CI verifies the static demo bundle instead.
      - run: npx vite build --config vite.demo.config.ts
