name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vite.config.ts reads the private Site hosting metadata; provide a placeholder
      # (the real ids stay out of the repository).
      - name: Placeholder hosting metadata for typecheck
        run: |
          mkdir -p .openai
          printf '{"d1":"DB","r2":"BUCKET","capabilities":["mcp"],"project_id":"appgprj_00000000000000000000000000000000"}' > .openai/hosting.json
      - run: npm run typecheck
      - run: npm test
      - run: python3 tests/migration_test.py
      # The production build needs the private .openai hosting metadata and the
      # verified pre-update snapshot, so CI verifies the static demo bundle instead.
      - run: npx vite build --config vite.demo.config.ts
